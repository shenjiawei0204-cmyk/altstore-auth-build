{
  "name": "Experimental unsigned AltStore authentication build",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "unsigned-altstore-auth-build",
    "cancel-in-progress": true
  },
  "env": {
    "GIT_LFS_SKIP_SMUDGE": "1",
    "CI": "1"
  },
  "jobs": {
    "build": {
      "if": "${{ github.event_name == 'workflow_dispatch' && github.repository == 'shenjiawei0204-cmyk/altstore-auth-build' && !github.event.repository.private }}",
      "runs-on": "macos-15",
      "timeout-minutes": 45,
      "steps": [
        {
          "name": "Check out the exact public upstream repair",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "altstoreio/AltStore",
            "ref": "22f766d2edb47626a082a1f775649bcf3fc43aff",
            "path": "upstream",
            "submodules": "recursive",
            "fetch-depth": 1,
            "persist-credentials": false,
            "lfs": false
          }
        },
        {
          "name": "Verify pinned source and select Xcode 26.3",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git -C upstream rev-parse HEAD)\" = \"22f766d2edb47626a082a1f775649bcf3fc43aff\"\ntest \"$(git -C upstream/Dependencies/AltSign rev-parse HEAD)\" = \"832d9cec339ea6ef6891011833dbb7227b028a29\"\ngit -C upstream submodule status --recursive | tee \"$RUNNER_TEMP/submodules.txt\"\nif grep -Eq '^[-+U]' \"$RUNNER_TEMP/submodules.txt\"; then echo 'Uninitialized or mismatched dependency'; exit 1; fi\ngrep -q 'authenticationUserAgent' upstream/AltStore/Operations/FetchAnisetteDataOperation.swift\ngrep -q 'anisetteDataResyncHandler' upstream/AltStore/Operations/AuthenticationOperation.swift\nxcode=\"/Applications/Xcode_26.3.app/Contents/Developer\"\ntest -d \"$xcode\"\necho \"DEVELOPER_DIR=$xcode\" >> \"$GITHUB_ENV\"\nDEVELOPER_DIR=\"$xcode\" xcodebuild -version\ngit -C upstream diff --exit-code -- AltStore.xcworkspace/xcshareddata/swiftpm/Package.resolved"
        },
        {
          "name": "Build an unsigned device app without provisioning access",
          "shell": "bash",
          "run": "set -euo pipefail\nset +e\nxcodebuild -workspace upstream/AltStore.xcworkspace -scheme AltStore -configuration Release -sdk iphoneos -destination \"generic/platform=iOS\" -onlyUsePackageVersionsFromResolvedFile -derivedDataPath \"$RUNNER_TEMP/AltStoreDerivedData\" -clonedSourcePackagesDirPath \"$RUNNER_TEMP/AltStorePackages\" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= COMPILER_INDEX_STORE_ENABLE=NO build > \"$RUNNER_TEMP/build.log\" 2>&1\nstatus=$?\nset -e\ntail -n 180 \"$RUNNER_TEMP/build.log\"\nif [ \"$status\" -ne 0 ]; then exit \"$status\"; fi\ngit -C upstream diff --exit-code -- AltStore.xcworkspace/xcshareddata/swiftpm/Package.resolved"
        },
        {
          "name": "Verify and package only a bounded unsigned IPA",
          "id": "package",
          "shell": "bash",
          "run": "set -euo pipefail\napp=\"$RUNNER_TEMP/AltStoreDerivedData/Build/Products/Release-iphoneos/AltStore.app\"\nout=\"$RUNNER_TEMP/export\"\nstage=\"$RUNNER_TEMP/ipa-stage\"\ntest -d \"$app\"\nplutil -lint \"$app/Info.plist\"\nexec_name=$(/usr/libexec/PlistBuddy -c \"Print CFBundleExecutable\" \"$app/Info.plist\")\n[[ -n \"$exec_name\" && \"$exec_name\" != */* ]]\nxcrun lipo -verify_arch arm64 \"$app/$exec_name\"\nxcrun vtool -show-build \"$app/$exec_name\" > \"$RUNNER_TEMP/macho-build.txt\"\ngrep -Eq 'platform[[:space:]]+IOS([[:space:]]|$)' \"$RUNNER_TEMP/macho-build.txt\"\nmkdir -p \"$out\" \"$stage/Payload\"\nditto \"$app\" \"$stage/Payload/AltStore.app\"\n(cd \"$stage\" && /usr/bin/zip -qry \"$out/AltStore-auth-test-unsigned.ipa\" Payload)\npython3 - \"$out\" \"$app\" <<'PY'\nimport datetime, hashlib, json, os, pathlib, plistlib, re, subprocess, sys, zipfile\nout, app = map(pathlib.Path, sys.argv[1:])\nipa = out / \"AltStore-auth-test-unsigned.ipa\"\nlimit = 100 * 1024 * 1024\nif not 0 < ipa.stat().st_size < limit: raise SystemExit(\"IPA exceeds the 100 MiB upload envelope\")\nwith zipfile.ZipFile(ipa) as archive:\n    names = archive.namelist()\n    if len(names) != len(set(names)): raise SystemExit(\"Duplicate ZIP entries\")\n    for name in names:\n        parts = pathlib.PurePosixPath(name).parts\n        if name.startswith(\"/\") or \"..\" in parts or \"\\\\\" in name: raise SystemExit(\"Invalid archive path\")\n        if pathlib.PurePosixPath(name).suffix.lower() in {\".p12\", \".pfx\", \".pem\", \".key\", \".mobiledevicepairing\", \".mobileprovision\"}: raise SystemExit(\"Signing/pairing material is not allowed in this unsigned artifact\")\n    if archive.testzip() is not None: raise SystemExit(\"ZIP CRC check failed\")\n    info = plistlib.loads(archive.read(\"Payload/AltStore.app/Info.plist\"))\n    if info.get(\"CFBundleIdentifier\") != \"com.rileytestut.AltStore\": raise SystemExit(\"Unexpected app identity\")\n    minimum = tuple(int(part) for part in str(info[\"MinimumOSVersion\"]).split(\".\"))\n    if minimum > (18, 7, 2): raise SystemExit(\"App OS floor exceeds the intended device version\")\n    executable = info[\"CFBundleExecutable\"]\n    if pathlib.PurePosixPath(executable).name != executable: raise SystemExit(\"Invalid executable name\")\n    header = archive.read(\"Payload/AltStore.app/\" + executable)[:4]\n    if header not in {b\"\\xcf\\xfa\\xed\\xfe\", b\"\\xca\\xfe\\xba\\xbe\", b\"\\xca\\xfe\\xba\\xbf\"}: raise SystemExit(\"Unexpected Mach-O header\")\n    roots = {name.split(\"/\")[1] for name in names if name.startswith(\"Payload/\") and len(name.split(\"/\")) > 2}\n    if roots != {\"AltStore.app\"}: raise SystemExit(\"Unexpected root application set\")\nwith ipa.open(\"rb\") as stream:\n    ipa_sha256 = hashlib.file_digest(stream, \"sha256\").hexdigest()\nmanifest = {\n    \"status\": \"unsigned_experimental_build\",\n    \"builtUtc\": datetime.datetime.now(datetime.timezone.utc).isoformat(),\n    \"sourceRepository\": \"https://github.com/altstoreio/AltStore\",\n    \"sourceCommit\": \"22f766d2edb47626a082a1f775649bcf3fc43aff\",\n    \"altSignCommit\": \"832d9cec339ea6ef6891011833dbb7227b028a29\",\n    \"bundleIdentifier\": info[\"CFBundleIdentifier\"],\n    \"version\": info.get(\"CFBundleShortVersionString\"),\n    \"build\": info.get(\"CFBundleVersion\"),\n    \"minimumOsVersion\": info[\"MinimumOSVersion\"],\n    \"authenticationVerified\": False,\n    \"deviceTested\": False,\n    \"providerConsentRequiredBeforeUse\": True,\n    \"localSigningAndInitializationRequired\": True,\n    \"submodules\": pathlib.Path(os.environ[\"RUNNER_TEMP\"], \"submodules.txt\").read_text(),\n    \"xcode\": subprocess.check_output([\"xcodebuild\", \"-version\"], text=True).strip(),\n    \"workflowRun\": \"https://github.com/\" + os.environ[\"GITHUB_REPOSITORY\"] + \"/actions/runs/\" + os.environ[\"GITHUB_RUN_ID\"],\n    \"ipaSha256\": ipa_sha256,\n}\n(out / \"BUILD-MANIFEST.json\").write_text(json.dumps(manifest, indent=2) + \"\\n\", encoding=\"utf-8\")\nlicense_text = pathlib.Path(\"upstream/LICENSE\").read_text(encoding=\"utf-8\")\nnotice = \"Experimental, non-official, unsigned AltStore build. Authentication and device renewal are NOT verified.\\n\\nMatching source: https://github.com/altstoreio/AltStore/tree/22f766d2edb47626a082a1f775649bcf3fc43aff\\nAltSign: https://github.com/rileytestut/AltSign/tree/832d9cec339ea6ef6891011833dbb7227b028a29\\nAll dependency commit IDs appear in BUILD-MANIFEST.json; each dependency retains its original license.\\nDo not sign in or replace an existing app before provider and identity review.\\n\\n\"\n(out / \"SOURCE-LICENSE.txt\").write_text(notice + license_text, encoding=\"utf-8\")\nchecksums = []\nfor name in (\"AltStore-auth-test-unsigned.ipa\", \"BUILD-MANIFEST.json\", \"SOURCE-LICENSE.txt\"):\n    with (out / name).open(\"rb\") as stream: digest = hashlib.file_digest(stream, \"sha256\").hexdigest()\n    checksums.append(digest + \"  \" + name)\n(out / \"SHA256SUMS.txt\").write_text(\"\\n\".join(checksums) + \"\\n\", encoding=\"utf-8\")\nif sum(path.stat().st_size for path in out.iterdir()) >= limit: raise SystemExit(\"Artifact set exceeds the 100 MiB upload envelope\")\nprint(json.dumps({\"status\": manifest[\"status\"], \"ipaBytes\": ipa.stat().st_size, \"ipaSha256\": manifest[\"ipaSha256\"], \"deviceTested\": False}))\nPY\necho \"package_ok=true\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "name": "Upload only the verified small artifact set",
          "if": "${{ success() && steps.package.outputs.package_ok == 'true' }}",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "AltStore-auth-test-unsigned",
            "path": "${{ runner.temp }}/export/AltStore-auth-test-unsigned.ipa\n${{ runner.temp }}/export/BUILD-MANIFEST.json\n${{ runner.temp }}/export/SHA256SUMS.txt\n${{ runner.temp }}/export/SOURCE-LICENSE.txt",
            "retention-days": 1,
            "if-no-files-found": "error",
            "include-hidden-files": false,
            "compression-level": 0
          }
        }
      ]
    }
  }
}
