{
  "name": "Experimental unsigned AltStore authentication build",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "unsigned-altstore-auth-build",
    "cancel-in-progress": true
  },
  "env": {
    "GIT_LFS_SKIP_SMUDGE": "1",
    "CI": "1"
  },
  "jobs": {
    "build": {
      "if": "${{ github.event_name == 'workflow_dispatch' && github.repository == 'shenjiawei0204-cmyk/altstore-auth-build' && !github.event.repository.private }}",
      "runs-on": "macos-15",
      "timeout-minutes": 45,
      "steps": [
        {
          "name": "Check out the exact public upstream repair",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "altstoreio/AltStore",
            "ref": "22f766d2edb47626a082a1f775649bcf3fc43aff",
            "path": "upstream",
            "submodules": "recursive",
            "fetch-depth": 1,
            "persist-credentials": false,
            "lfs": false
          }
        },
        {
          "name": "Verify pinned source and select Xcode 26.3",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git -C upstream rev-parse HEAD)\" = \"22f766d2edb47626a082a1f775649bcf3fc43aff\"\ntest \"$(git -C upstream/Dependencies/AltSign rev-parse HEAD)\" = \"832d9cec339ea6ef6891011833dbb7227b028a29\"\ngit -C upstream submodule status --recursive | tee \"$RUNNER_TEMP/submodules.txt\"\nif grep -Eq '^[-+U]' \"$RUNNER_TEMP/submodules.txt\"; then echo 'Uninitialized or mismatched dependency'; exit 1; fi\ngrep -q 'authenticationUserAgent' upstream/AltStore/Operations/FetchAnisetteDataOperation.swift\ngrep -q 'anisetteDataResyncHandler' upstream/AltStore/Operations/AuthenticationOperation.swift\nxcode=\"/Applications/Xcode_26.3.app/Contents/Developer\"\ntest -d \"$xcode\"\necho \"DEVELOPER_DIR=$xcode\" >> \"$GITHUB_ENV\"\nDEVELOPER_DIR=\"$xcode\" xcodebuild -version\ngit -C upstream diff --exit-code -- AltStore.xcworkspace/xcshareddata/swiftpm/Package.resolved"
        },
        {
          "name": "Apply fixed-provider restriction and validate origin policy",
          "id": "provider_policy",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - upstream \"$RUNNER_TEMP/provider-policy.json\" \"$RUNNER_TEMP/ProviderPolicyTests.swift\" <<'PY'\n\"\"\"Hash-bound restriction of three public upstream files; contains no user data.\"\"\"\nimport hashlib\nimport json\nfrom pathlib import Path\nimport sys\n\nSOURCE_COMMIT = \"22f766d2edb47626a082a1f775649bcf3fc43aff\"\nPROVIDER = \"https://ani.jkcoxson.com\"\nFETCH = \"AltStore/Operations/FetchAnisetteDataOperation.swift\"\nMANAGER = \"AltStore/Anisette/AnisetteServerManager.swift\"\nVIEW = \"AltStore/Settings/RemoteAltServerView.swift\"\nEXPECTED = {\n    FETCH: \"46b4539dc93b611ee04553d4f7073d4b601cd0301d2bf336717188c5fc65ac0b\",\n    MANAGER: \"d0d73b97f41978927bf851055600e4da1db56559a5146df5a48c16403a0f3960\",\n    VIEW: \"085aa659b733f8e5b21698f5bf1ac3820e622c0a17e8fa3c6892148a41cd52ee\",\n}\n\nPOLICY = '''// BEGIN FIXED ANISETTE PROVIDER POLICY\nenum FixedAnisetteProviderPolicy\n{\n    static let url = URL(string: \"https://ani.jkcoxson.com\")!\n\n    static func allows(_ candidate: URL?) -> Bool\n    {\n        guard let candidate else { return false }\n        return candidate.scheme?.lowercased() == \"https\"\n            && candidate.host?.lowercased() == \"ani.jkcoxson.com\"\n            && (candidate.port == nil || candidate.port == 443)\n            && candidate.user == nil && candidate.password == nil\n            && candidate.fragment == nil\n    }\n}\n\n// Applied only to provider HTTP/WebSocket sessions, never to Apple sessions.\nfinal class FixedAnisetteRedirectDelegate: NSObject, URLSessionTaskDelegate, @unchecked Sendable\n{\n    func urlSession(_ session: URLSession, task: URLSessionTask,\n                    willPerformHTTPRedirection response: HTTPURLResponse,\n                    newRequest request: URLRequest,\n                    completionHandler: @escaping @Sendable (URLRequest?) -> Void)\n    {\n        completionHandler(nil)\n    }\n}\n// END FIXED ANISETTE PROVIDER POLICY\n'''\n\nPROVIDER_SESSION = '''        let providerConfiguration = URLSessionConfiguration.ephemeral\n        providerConfiguration.urlCache = nil\n        providerConfiguration.requestCachePolicy = .reloadIgnoringLocalCacheData\n        providerConfiguration.httpCookieStorage = nil\n        providerConfiguration.urlCredentialStorage = nil\n        providerConfiguration.httpShouldSetCookies = false\n        providerConfiguration.timeoutIntervalForRequest = 30\n        providerConfiguration.timeoutIntervalForResource = 120\n'''\n\n\ndef replace_one(text, old, new):\n    if text.count(old) != 1:\n        raise ValueError(\"Expected exactly one public-source patch anchor\")\n    return text.replace(old, new, 1)\n\n\ndef replace_between(text, start, end, new):\n    if text.count(start) != 1 or end not in text[text.index(start) + len(start):]:\n        raise ValueError(\"Expected one start and a following public-source block boundary\")\n    first, last = text.index(start), text.index(end, text.index(start))\n    return text[:first] + new + text[last:]\n\n\ndef patch_texts(original):\n    if set(original) != set(EXPECTED):\n        raise ValueError(\"Unexpected source file set\")\n    for name, expected in EXPECTED.items():\n        if hashlib.sha256(original[name].encode(\"utf-8\")).hexdigest() != expected:\n            raise ValueError(\"Unexpected source hash: \" + name)\n    changed = dict(original)\n\n    text = changed[FETCH]\n    text = replace_between(text, \"// Apple only accepts anisette data generated\", \"extension FetchAnisetteDataOperation\", POLICY + \"\\n\")\n    text = replace_one(text, \"    private let session: URLSession\", \"    private let session: URLSession\\n    private let providerSession: URLSession\")\n    text = replace_one(text, \"        self.session = URLSession(configuration: configuration)\", \"        self.session = URLSession(configuration: configuration)\\n\\n\" + PROVIDER_SESSION + \"        self.providerSession = URLSession(configuration: providerConfiguration, delegate: FixedAnisetteRedirectDelegate(), delegateQueue: nil)\")\n    text = replace_between(text, \"    func fetchAnisetteDataFromAvailableServer()\", \"    // Based on SideStore's FetchAnisetteDataOperation\", '''    func fetchAnisetteDataFromAvailableServer() async throws -> ALTAnisetteData\n    {\n        // A failure propagates. Stored preferences and server lists are not used.\n        return try await self.fetchAnisetteData(from: FixedAnisetteProviderPolicy.url)\n    }\n\n''')\n    text = replace_one(text, \"        // 1. Fetch client_info from the server\", '''        guard FixedAnisetteProviderPolicy.allows(serverURL) else\n        {\n            throw AnisetteServerError.invalidServer()\n        }\n\n        // 1. Fetch client_info from the server''')\n    text = replace_one(text, \"        let socket = self.session.webSocketTask(with: socketRequest)\", \"        let socket = self.providerSession.webSocketTask(with: socketRequest)\")\n    text = replace_one(text, \"        let data: Data\\n        let urlResponse: URLResponse\", '''        if let anisetteServerURL\n        {\n            guard FixedAnisetteProviderPolicy.allows(anisetteServerURL),\n                  let url = request.url, FixedAnisetteProviderPolicy.allows(url) else\n            {\n                throw AnisetteServerError.invalidServer()\n            }\n        }\n\n        let data: Data\n        let urlResponse: URLResponse''')\n    text = replace_one(text, \"try await self.session.data(for: request)\", \"try await (anisetteServerURL == nil ? self.session : self.providerSession).data(for: request)\")\n    changed[FETCH] = text\n\n    text = changed[MANAGER]\n    text = replace_between(text, \"private extension URL\\n\", \"class AnisetteServerManager\", \"\")\n    text = replace_between(text, \"    private init()\\n\", \"    func fetchServers()\", \"    private init()\\n    {\\n\" + PROVIDER_SESSION + \"        self.session = URLSession(configuration: providerConfiguration, delegate: FixedAnisetteRedirectDelegate(), delegateQueue: nil)\\n    }\\n\\n\")\n    text = replace_between(text, \"    func fetchServers()\", \"    // Verifies a URL\", '''    func fetchServers() async throws -> [AnisetteServer]\n    {\n        return [AnisetteServer(name: \"jkcoxson (fixed)\", url: FixedAnisetteProviderPolicy.url)]\n    }\n\n''')\n    text = replace_one(text, \"        let clientInfoURL = url.appending\", '''        guard FixedAnisetteProviderPolicy.allows(url) else\n        {\n            throw AnisetteServerError.invalidServer()\n        }\n\n        let clientInfoURL = url.appending''')\n    changed[MANAGER] = text\n\n    text = changed[VIEW]\n    text = replace_between(text, \"    @State\\n    private var availableServers:\", \"    @State\\n    private var isConnected\", \"\")\n    text = replace_between(text, \"            if let availableServers\\n\", \"            Section {\\n                SwiftUI.Button(role: .destructive)\", '''            // BEGIN FIXED PROVIDER SETTINGS SECTION\n            Section {\n                Text(FixedAnisetteProviderPolicy.url.absoluteString)\n                    .font(.footnote)\n                    .textSelection(.enabled)\n            } header: {\n                Text(\"Fixed authentication provider\")\n            } footer: {\n                Text(\"Experimental fixed-provider build. Automatic provider switching is disabled; service errors stop the operation. Apple authentication endpoints are unchanged.\")\n            }\n            // END FIXED PROVIDER SETTINGS SECTION\n\n''')\n    text = replace_one(text, \"        .task { await loadServers() }\\n        .refreshable { await loadServers() }\\n\", \"\")\n    text = replace_between(text, '        .alert(\"Couldn\\'t select server\"', \"private extension RemoteAltServerView\", \"    }\\n}\\n\\n\")\n    text = replace_between(text, \"    func loadServers()\", \"    func monitorConnection()\", \"\")\n    changed[VIEW] = text\n    return changed\n\n\ndef swift_tests(fetch_text):\n    first = fetch_text.index(\"// BEGIN FIXED ANISETTE PROVIDER POLICY\")\n    last = fetch_text.index(\"// END FIXED ANISETTE PROVIDER POLICY\")\n    policy = fetch_text[first:last]\n    good = [PROVIDER, PROVIDER + \"/v3/client_info\", PROVIDER + \"/v3/get_headers\", \"https://ani.jkcoxson.com:443/v3/provisioning_session\", \"HTTPS://ANI.JKCOXSON.COM/v3/client_info\"]\n    bad = [\"http://ani.jkcoxson.com\", \"ws://ani.jkcoxson.com\", \"wss://ani.jkcoxson.com\", \"https://ani.jkcoxson.com.evil.invalid\", \"https://evil.invalid/ani.jkcoxson.com\", \"https://sub.ani.jkcoxson.com\", \"https://ani.jkcoxson.com.\", \"https://ani.jkcoxson.com:444\", \"https://user:pass@ani.jkcoxson.com\", \"https://user@ani.jkcoxson.com\", \"https://ani.jkcoxson.com/#fragment\", \"https://127.0.0.1\", \"https://gsa.apple.com\", \"https://ani2.stikstore.app\", \"https://ani.sidestore.io\"]\n    return \"import Foundation\\n\" + policy + \"\\nlet allowed = \" + json.dumps(good) + \"\\nlet denied = \" + json.dumps(bad) + '''\nfor raw in allowed { precondition(FixedAnisetteProviderPolicy.allows(URL(string: raw)), \"Allowed origin rejected: \" + raw) }\nfor raw in denied { precondition(!FixedAnisetteProviderPolicy.allows(URL(string: raw)), \"Unexpected origin allowed: \" + raw) }\nprecondition(!FixedAnisetteProviderPolicy.allows(nil))\nlet _: URLSessionTaskDelegate = FixedAnisetteRedirectDelegate()\nprint(\"Provider origin policy probes passed: 21; zero network requests\")\n'''\n\n\ndef swift_ui_probe(view_text, fetch_text):\n    section = view_text.split(\"// BEGIN FIXED PROVIDER SETTINGS SECTION\", 1)[1].split(\"// END FIXED PROVIDER SETTINGS SECTION\", 1)[0].strip()\n    policy = swift_tests(fetch_text).split(\"\\nlet allowed =\", 1)[0]\n    return policy + \"\\nimport SwiftUI\\nstruct FixedProviderSectionSmoke: View {\\n    var body: some View {\\n\" + section + \"\\n    }\\n}\\n\"\n\n\ndef apply(root, report_path, swift_path):\n    root = Path(root)\n    original = {name: (root / name).read_bytes().decode(\"utf-8\") for name in EXPECTED}\n    changed = patch_texts(original)\n    report = {\n        \"sourceBaseCommit\": SOURCE_COMMIT,\n        \"provider\": PROVIDER,\n        \"automaticFallback\": False,\n        \"cachedSelectionUsed\": False,\n        \"redirects\": \"reject\",\n        \"providerCredentialOrCookieStorage\": False,\n        \"appleSessionUnchanged\": True,\n        \"files\": {name: {\"beforeSha256\": EXPECTED[name], \"afterSha256\": hashlib.sha256(text.encode(\"utf-8\")).hexdigest()} for name, text in changed.items()},\n    }\n    for name, text in changed.items():\n        (root / name).write_bytes(text.encode(\"utf-8\"))\n    Path(swift_path).write_text(swift_tests(changed[FETCH]), encoding=\"utf-8\", newline=\"\\n\")\n    Path(swift_path).with_name(\"ProviderSettingsTypecheck.swift\").write_text(swift_ui_probe(changed[VIEW], changed[FETCH]), encoding=\"utf-8\", newline=\"\\n\")\n    Path(report_path).write_text(json.dumps(report, indent=2) + \"\\n\", encoding=\"utf-8\", newline=\"\\n\")\n    return report\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 4:\n        raise SystemExit(\"Expected upstream root, policy report, Swift probe path\")\n    print(json.dumps(apply(Path(sys.argv[1]), Path(sys.argv[2]), Path(sys.argv[3])), indent=2))\n\nPY\nxcrun swift \"$RUNNER_TEMP/ProviderPolicyTests.swift\"\nxcrun swiftc -typecheck -target arm64-apple-ios17.4 -sdk \"$(xcrun --sdk iphoneos --show-sdk-path)\" \"$RUNNER_TEMP/ProviderSettingsTypecheck.swift\"\necho \"iOS provider settings typecheck passed\""
        },
        {
          "name": "Apply bounded pre-auth ADI recovery and execute actual-source offline probes",
          "id": "adi_recovery",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/apply_adi_recovery.py\" <<'PY'\n\"\"\"Pinned three-file bounded ADI recovery patch, applied after provider policy.\"\"\"\r\nimport hashlib\r\nimport json\r\nimport os\r\nfrom pathlib import Path\r\nimport sys\r\n\r\nFETCH = 'AltStore/Operations/FetchAnisetteDataOperation.swift'\r\nAUTH = 'AltStore/Operations/AuthenticationOperation.swift'\r\nKEYCHAIN = 'AltStoreCore/Components/Keychain.swift'\r\nEXPECTED = {\r\n    FETCH: '15a695d36b6a7ec14dc041680448d1049979cd859b4e7f026f4747e54cbd9bcf',\r\n    AUTH: 'fbd0db40765b25e09e544a962fa8cdbae0e63594487ca9a3ddaae763856600ca',\r\n    KEYCHAIN: '15a027ac9f21a5f4db29579a484c6afde4ef5a8f6c2b63e76b93a4fd41dc8614',\r\n}\r\nPOLICY_BEGIN = '// BEGIN BOUNDED ADI RECOVERY POLICY'\r\nPOLICY_END = '// END BOUNDED ADI RECOVERY POLICY'\r\nPOLICY = r'''// BEGIN BOUNDED ADI RECOVERY POLICY\r\n// Foundation-only policy; the offline native probe extracts this exact block.\r\nstruct ADICacheTuple: Equatable, Sendable\r\n{\r\n    let identity: Data\r\n    let adiPB: Data\r\n    let clientInfo: String\r\n\r\n    func isCoherent(currentClientInfo: String) -> Bool\r\n    {\r\n        return identity.count == 16 && !adiPB.isEmpty && clientInfo == currentClientInfo\r\n    }\r\n}\r\n\r\nstruct ADIHeaderFailure: Error\r\n{\r\n    let underlying: Error\r\n    let permitsFreshPreparation: Bool\r\n\r\n    init(result: String?, message: String?, underlying: Error)\r\n    {\r\n        self.underlying = underlying\r\n        let normalized = message?.split(whereSeparator: { $0.isWhitespace }).joined(separator: \" \")\r\n        self.permitsFreshPreparation = result == \"GetHeadersError\" && normalized == \"ADI Login error: -45061\"\r\n    }\r\n}\r\n\r\nenum ADIRecoveryError: Error\r\n{\r\n    case busy, incoherentCache, invalidFreshTuple, cacheWriteFailed\r\n}\r\n\r\n// Reject overlaps immediately. NSLock is held only for these synchronous state accesses.\r\nfinal class ADIRecoveryGate: @unchecked Sendable\r\n{\r\n    private let lock = NSLock()\r\n    private var occupied = false\r\n\r\n    func tryAcquire() -> Bool\r\n    {\r\n        guard lock.try() else { return false }\r\n        defer { lock.unlock() }\r\n        guard !occupied else { return false }\r\n        occupied = true\r\n        return true\r\n    }\r\n\r\n    func release()\r\n    {\r\n        lock.lock()\r\n        occupied = false\r\n        lock.unlock()\r\n    }\r\n}\r\n\r\n// Admission lasts from the initial fetch through the Apple authentication completion.\r\n// Resync uses the independent fetch gate, so it does not deadlock behind its own authentication.\r\nfinal class ADIAuthenticationLease: @unchecked Sendable\r\n{\r\n    private static let sharedGate = ADIRecoveryGate()\r\n    private let gate: ADIRecoveryGate\r\n    private let lock = NSLock()\r\n    private var finished = false\r\n\r\n    private init(gate: ADIRecoveryGate) { self.gate = gate }\r\n\r\n    static func begin() throws -> ADIAuthenticationLease { try begin(gate: sharedGate) }\r\n\r\n    static func begin(gate: ADIRecoveryGate) throws -> ADIAuthenticationLease\r\n    {\r\n        guard gate.tryAcquire() else { throw ADIRecoveryError.busy }\r\n        return ADIAuthenticationLease(gate: gate)\r\n    }\r\n\r\n    func finish()\r\n    {\r\n        lock.lock()\r\n        defer { lock.unlock() }\r\n        guard !finished else { return }\r\n        finished = true\r\n        gate.release()\r\n    }\r\n\r\n    deinit { finish() }\r\n}\r\n\r\n// Throwing raw access is injected; nil means item-not-found, never a swallowed I/O error.\r\n// This same publication implementation is extracted verbatim into the offline probe.\r\nstruct ADICacheStorage\r\n{\r\n    let readIdentity: () throws -> Data?\r\n    let readADIPB: () throws -> Data?\r\n    let readClientInfo: () throws -> String?\r\n    let writeIdentity: (Data) throws -> Void\r\n    let writeADIPB: (Data) throws -> Void\r\n    let writeClientInfo: (String) throws -> Void\r\n    let removeClientInfo: () throws -> Void\r\n\r\n    func load() throws -> ADICacheTuple?\r\n    {\r\n        let identity = try readIdentity()\r\n        let adiPB = try readADIPB()\r\n        let clientInfo = try readClientInfo()\r\n        guard let identity = identity, let adiPB = adiPB, let clientInfo = clientInfo else { return nil }\r\n        return ADICacheTuple(identity: identity, adiPB: adiPB, clientInfo: clientInfo)\r\n    }\r\n\r\n    func invalidate() throws\r\n    {\r\n        // Stop immediately if removal OR its verification read fails.\r\n        try removeClientInfo()\r\n        guard try readClientInfo() == nil else { throw ADIRecoveryError.cacheWriteFailed }\r\n    }\r\n\r\n    func publish(_ fresh: ADICacheTuple) throws\r\n    {\r\n        do\r\n        {\r\n            try writeIdentity(fresh.identity)\r\n            guard try readIdentity() == fresh.identity else { throw ADIRecoveryError.cacheWriteFailed }\r\n            try writeADIPB(fresh.adiPB)\r\n            guard try readADIPB() == fresh.adiPB else { throw ADIRecoveryError.cacheWriteFailed }\r\n            // Commit marker is written only after both payloads have verified independently.\r\n            try writeClientInfo(fresh.clientInfo)\r\n            guard try readClientInfo() == fresh.clientInfo else { throw ADIRecoveryError.cacheWriteFailed }\r\n        }\r\n        catch\r\n        {\r\n            // Remove even an uncertain metadata write; cleanup errors also propagate.\r\n            // If cleanup fails, payloads were either uncommitted or entirely verified fresh, never mixed-valid.\r\n            try invalidate()\r\n            throw error\r\n        }\r\n    }\r\n}\r\n\r\nenum ADIRecoveryPolicy\r\n{\r\n    static let gate = ADIRecoveryGate()\r\n\r\n    static func run<Output>(gate: ADIRecoveryGate, currentClientInfo: String, allowsRecovery: Bool,\r\n                            load: () throws -> ADICacheTuple?, invalidate: () throws -> Void,\r\n                            prepare: () async throws -> ADICacheTuple,\r\n                            headers: (ADICacheTuple) async throws -> Output,\r\n                            publish: (ADICacheTuple) throws -> Void,\r\n                            checkCancellation: () throws -> Void) async throws -> (ADICacheTuple, Output)\r\n    {\r\n        guard gate.tryAcquire() else { throw ADIRecoveryError.busy }\r\n        defer { gate.release() }\r\n        try checkCancellation()\r\n        var prepared = false\r\n\r\n        func freshHeaders() async throws -> (ADICacheTuple, Output)\r\n        {\r\n            // Missing cache and cached-error recovery share this single budget.\r\n            guard allowsRecovery, !prepared else { throw ADIRecoveryError.incoherentCache }\r\n            prepared = true\r\n            try checkCancellation()\r\n            // Mark old tuple ineligible before preparation; never publish partial fresh state.\r\n            try invalidate()\r\n            let fresh = try await prepare()\r\n            try checkCancellation()\r\n            guard fresh.isCoherent(currentClientInfo: currentClientInfo) else { throw ADIRecoveryError.invalidFreshTuple }\r\n            let output = try await headers(fresh)\r\n            try checkCancellation()\r\n            try publish(fresh)\r\n            return (fresh, output)\r\n        }\r\n\r\n        do\r\n        {\r\n            if let cached = try load(), cached.isCoherent(currentClientInfo: currentClientInfo)\r\n            {\r\n                do\r\n                {\r\n                    let output = try await headers(cached)\r\n                    try checkCancellation()\r\n                    return (cached, output)\r\n                }\r\n                catch let failure as ADIHeaderFailure\r\n                {\r\n                    try checkCancellation()\r\n                    guard allowsRecovery, !prepared, failure.permitsFreshPreparation else { throw failure }\r\n                    return try await freshHeaders()\r\n                }\r\n            }\r\n            return try await freshHeaders()\r\n        }\r\n        catch let failure as ADIHeaderFailure\r\n        {\r\n            // Keep AnisetteServerError (including the original provider diagnostic) outward-facing.\r\n            throw failure.underlying\r\n        }\r\n    }\r\n}\r\n// END BOUNDED ADI RECOVERY POLICY\r\n'''\r\n\r\nADAPTER = r'''        // 2-4. Keep identity/blob/metadata together and prepare at most once, before SRP only.\r\n        let storage = ADICacheStorage(\r\n            readIdentity: { try Keychain.shared.readADIIdentity() },\r\n            readADIPB: { try Keychain.shared.readADIBlob() },\r\n            readClientInfo: { try Keychain.shared.readADIClientInfo() },\r\n            writeIdentity: { try Keychain.shared.writeADIIdentity($0) },\r\n            writeADIPB: { try Keychain.shared.writeADIBlob($0) },\r\n            writeClientInfo: { try Keychain.shared.writeADIClientInfo($0) },\r\n            removeClientInfo: { try Keychain.shared.removeADIClientInfo() })\r\n        let (tuple, headerValues) = try await ADIRecoveryPolicy.run(\r\n            gate: ADIRecoveryPolicy.gate,\r\n            currentClientInfo: response.clientInfo,\r\n            allowsRecovery: self.allowsPreAuthenticationADIRecovery && self.sim == nil,\r\n            load: storage.load,\r\n            invalidate: storage.invalidate,\r\n            prepare: {\r\n                let identity = AnisetteIdentity.make()\r\n                let adiPB = try await self.provision(against: serverURL, clientInfo: response.clientInfo,\r\n                                                     userAgent: response.userAgent, identity: identity)\r\n                return ADICacheTuple(identity: identity.bytes, adiPB: adiPB, clientInfo: response.clientInfo)\r\n            },\r\n            headers: { tuple in\r\n                try await self.fetchHeaders(from: serverURL, identity: AnisetteIdentity(bytes: tuple.identity),\r\n                                            adiPB: tuple.adiPB, sim: self.sim)\r\n            },\r\n            publish: storage.publish,\r\n            checkCancellation: {\r\n                try Task.checkCancellation()\r\n                if self.isCancelled { throw CancellationError() }\r\n            })\r\n        let identity = AnisetteIdentity(bytes: tuple.identity)\r\n        let (machineID, oneTimePassword, routingInfo) = headerValues\r\n'''\r\n\r\n# Add only throwing access to the three existing nonsynchronizable helper items.\r\n# Existing property wrappers, credentials, pairing fields and reset stay byte-for-byte intact.\r\nKEYCHAIN_ADI = r'''\r\n// BEGIN THROWING ADI STORAGE\r\npublic extension Keychain\r\n{\r\n    func readADIIdentity() throws -> Data? { try self.localKeychain.getData(\"anisetteIdentityKey\") }\r\n    func readADIBlob() throws -> Data? { try self.localKeychain.getData(\"anisetteADIPB\") }\r\n    func readADIClientInfo() throws -> String? { try self.localKeychain.getString(\"anisetteProvisioningClientInfo\") }\r\n    func writeADIIdentity(_ value: Data) throws { try self.localKeychain.set(value, key: \"anisetteIdentityKey\") }\r\n    func writeADIBlob(_ value: Data) throws { try self.localKeychain.set(value, key: \"anisetteADIPB\") }\r\n    func writeADIClientInfo(_ value: String) throws { try self.localKeychain.set(value, key: \"anisetteProvisioningClientInfo\") }\r\n    func removeADIClientInfo() throws { try self.localKeychain.remove(\"anisetteProvisioningClientInfo\") }\r\n}\r\n// END THROWING ADI STORAGE\r\n'''\r\n\r\ndef replace_one(text, old, new):\r\n    if text.count(old) != 1:\r\n        raise ValueError('Expected exactly one ADI recovery anchor')\r\n    return text.replace(old, new, 1)\r\n\r\n\r\ndef patch_texts(original: dict) -> dict:\r\n    if set(original) != set(EXPECTED):\r\n        raise ValueError('Unexpected source file set')\r\n    for name, expected in EXPECTED.items():\r\n        if hashlib.sha256(original[name].encode('utf-8')).hexdigest() != expected:\r\n            raise ValueError('Unexpected source hash: ' + name)\r\n    changed = dict(original)\r\n    text = changed[FETCH]\r\n    text = replace_one(text, '// END FIXED ANISETTE PROVIDER POLICY\\n', '// END FIXED ANISETTE PROVIDER POLICY\\n\\n' + POLICY)\r\n    text = replace_one(text, '\\n    var sim: String?\\n', '\\n    var sim: String?\\n\\n    // Opted in only by the original AuthenticationOperation fetch, never resync/later refresh.\\n    var allowsPreAuthenticationADIRecovery = false\\n')\r\n    first = text.index('        // 2. Load or generate the persisted device identity')\r\n    last = text.index('        ALTAppleAPI.shared.authenticationUserAgent = response.userAgent', first)\r\n    text = text[:first] + ADAPTER + text[last:]\r\n    text = replace_one(text,\r\n        '            throw AnisetteServerError.invalidResponse(serverURL: serverURL, debugDescription: response.message)\\n        }\\n\\n        guard let machineID',\r\n        '            let underlying = AnisetteServerError.invalidResponse(serverURL: serverURL, debugDescription: response.message)\\n            throw ADIHeaderFailure(result: response.result, message: response.message, underlying: underlying)\\n        }\\n\\n        guard let machineID')\r\n    changed[FETCH] = text\r\n    text = changed[AUTH]\r\n    start = text.index('    func authenticate(appleID:')\r\n    end = text.index('    func fetchTeam(', start)\r\n    body = text[start:end]\r\n    # Acquire before initial fetch; callback completion releases occupancy, not a held mutex.\r\n    anchor = \"        self.appleIDEmailAddress = appleID\\n\"\r\n    admission = \"\"\"        self.appleIDEmailAddress = appleID\r\n\r\n        guard !self.isCancelled else { return completionHandler(.failure(OperationError.cancelled)) }\r\n        let adiAuthenticationLease: ADIAuthenticationLease\r\n        do { adiAuthenticationLease = try ADIAuthenticationLease.begin() }\r\n        catch { completionHandler(.failure(error)); return }\r\n        let finishAuthentication: (Result<(ALTAccount, ALTAppleAPISession), Swift.Error>) -> Void = { result in\r\n            adiAuthenticationLease.finish()\r\n            completionHandler(result)\r\n        }\r\n        // Cancellation remains cooperative: keep admission until in-flight fetch/Apple callback settles.\r\n        guard !self.isCancelled else { return finishAuthentication(.failure(OperationError.cancelled)) }\r\n\"\"\"\r\n    body = replace_one(body, anchor, admission)\r\n    body = replace_one(body,\r\n        '\\n        fetchAnisetteDataOperation.resultHandler = { (result) in\\n',\r\n        '\\n        fetchAnisetteDataOperation.allowsPreAuthenticationADIRecovery = true\\n'\r\n        '        fetchAnisetteDataOperation.resultHandler = { (result) in\\n'\r\n        '            guard !self.isCancelled else { return finishAuthentication(.failure(OperationError.cancelled)) }\\n')\r\n    body = replace_one(body, 'case .failure(let error): completionHandler(.failure(error))', 'case .failure(let error): finishAuthentication(.failure(error))')\r\n    body = replace_one(body, '                    ALTAppleAPI.shared.anisetteDataResyncHandler = nil\\n',\r\n        '                    ALTAppleAPI.shared.anisetteDataResyncHandler = nil\\n'\r\n        '                    guard !self.isCancelled else { return finishAuthentication(.failure(OperationError.cancelled)) }\\n')\r\n    body = replace_one(body, 'completionHandler(.success((account, session)))', 'finishAuthentication(.success((account, session)))')\r\n    body = replace_one(body, 'completionHandler(.failure(error ?? OperationError.unknown()))', 'finishAuthentication(.failure(error ?? OperationError.unknown()))')\r\n    changed[AUTH] = text[:start] + body + text[end:]\r\n    changed[KEYCHAIN] += KEYCHAIN_ADI\r\n    return changed\r\n\r\n\r\ndef swift_tests(patched_fetch_text) -> str:\r\n    if patched_fetch_text.count(POLICY_BEGIN) != 1 or patched_fetch_text.count(POLICY_END) != 1:\r\n        raise ValueError('Missing unique ADI policy markers')\r\n    policy = patched_fetch_text.split(POLICY_BEGIN, 1)[1].split(POLICY_END, 1)[0]\r\n    return 'import Foundation\\n' + policy + '\\n' + NATIVE_PROBES\r\n\r\n\r\ndef apply(root, report_path, swift_path) -> dict:\r\n    root, report_path, swift_path = Path(root), Path(report_path), Path(swift_path)\r\n    original = {name: (root / name).read_bytes().decode('utf-8') for name in EXPECTED}\r\n    changed = patch_texts(original)\r\n    probe = swift_tests(changed[FETCH])\r\n    outputs = [(root / name).resolve() for name in EXPECTED] + [report_path.resolve(), swift_path.resolve()]\r\n    for i, path in enumerate(outputs):\r\n        for other in outputs[i + 1:]:\r\n            if path == other or path in other.parents or other in path.parents:\r\n                raise ValueError('Output paths overlap')\r\n        if not path.parent.is_dir():\r\n            raise ValueError('Output parent must be an existing directory: ' + str(path))\r\n        if path.exists() and not path.is_file():\r\n            raise ValueError('Output must be a regular file: ' + str(path))\r\n        if not os.access(path if path.exists() else path.parent, os.W_OK):\r\n            raise ValueError('Output is not writable: ' + str(path))\r\n    report = {\r\n        'sourceBaseCommit': '22f766d2edb47626a082a1f775649bcf3fc43aff',\r\n        'provider': 'https://ani.jkcoxson.com',\r\n        'maximumFreshPreparations': 1,\r\n        'initialPreAuthenticationOnly': True,\r\n        'nativeProbeExecutedLocally': False,\r\n        'nativeProbeScenarios': NATIVE_PROBE_COUNT,\r\n        'files': {name: {'beforeSha256': EXPECTED[name], 'afterSha256': hashlib.sha256(text.encode()).hexdigest()} for name, text in changed.items()},\r\n    }\r\n    for name, text in changed.items():\r\n        (root / name).write_bytes(text.encode('utf-8'))\r\n    swift_path.write_text(probe, encoding='utf-8', newline='\\n')\r\n    report_path.write_text(json.dumps(report, indent=2) + '\\n', encoding='utf-8', newline='\\n')\r\n    return report\r\n\r\n\r\nNATIVE_PROBE_COUNT = 32\r\nNATIVE_PROBES = r'''\r\nenum ProbeError: Error, Equatable { case helper, http503, preparation, publication, storage }\r\n\r\n// Synthetic raw storage boundary only; all load/invalidate/publish ordering is production code.\r\nfinal class ProbeStorage\r\n{\r\n    var identity: Data?\r\n    var blob: Data?\r\n    var info: String?\r\n    var events: [String] = []\r\n    var counts: [String: Int] = [:]\r\n    var failures: Set<String> = []\r\n    var mismatches: Set<String> = []\r\n    var failAfterMutation = false\r\n    var ignoredWrites: Set<String> = []\r\n\r\n    init(_ tuple: ADICacheTuple?)\r\n    {\r\n        identity = tuple?.identity; blob = tuple?.adiPB; info = tuple?.clientInfo\r\n    }\r\n\r\n    var tuple: ADICacheTuple? {\r\n        guard let identity = identity, let blob = blob, let info = info else { return nil }\r\n        return ADICacheTuple(identity: identity, adiPB: blob, clientInfo: info)\r\n    }\r\n\r\n    func event(_ name: String) -> String\r\n    {\r\n        counts[name, default: 0] += 1\r\n        let key = name + \"#\" + String(counts[name]!)\r\n        events.append(key)\r\n        return key\r\n    }\r\n\r\n    func read<T>(_ name: String, _ value: T?) throws -> T?\r\n    {\r\n        let key = event(name)\r\n        if failures.contains(key) { throw ProbeError.storage }\r\n        return mismatches.contains(key) ? nil : value\r\n    }\r\n\r\n    func write(_ name: String, _ mutate: () -> Void) throws\r\n    {\r\n        let key = event(name)\r\n        if failures.contains(key) && !failAfterMutation { throw ProbeError.storage }\r\n        if !ignoredWrites.contains(key) { mutate() }\r\n        if failures.contains(key) { throw ProbeError.storage }\r\n    }\r\n\r\n    var adapter: ADICacheStorage {\r\n        ADICacheStorage(\r\n            readIdentity: { try self.read(\"readIdentity\", self.identity) },\r\n            readADIPB: { try self.read(\"readBlob\", self.blob) },\r\n            readClientInfo: { try self.read(\"readInfo\", self.info) },\r\n            writeIdentity: { value in try self.write(\"writeIdentity\") { self.identity = value } },\r\n            writeADIPB: { value in try self.write(\"writeBlob\") { self.blob = value } },\r\n            writeClientInfo: { value in try self.write(\"writeInfo\") { self.info = value } },\r\n            removeClientInfo: { try self.write(\"removeInfo\") { self.info = nil } })\r\n    }\r\n}\r\n\r\n// Every scenario runs the production orchestration with synthetic in-memory closures.\r\nfinal class ProbeState\r\n{\r\n    let storage: ProbeStorage\r\n    var cached: ADICacheTuple? { storage.tuple }\r\n    var preparations = 0\r\n    var requests: [ADICacheTuple] = []\r\n    var publications = 0\r\n    var invalidations = 0\r\n    var cancellationChecks = 0\r\n    var failPreparation = false\r\n    var failPublication = false\r\n    var cancelAfterPreparation = false\r\n    var fresh = ADICacheTuple(identity: Data(repeating: 2, count: 16), adiPB: Data([2]), clientInfo: \"current\")\r\n    var errors: [Error?] = []\r\n    let gate = ADIRecoveryGate()\r\n\r\n    init(_ cached: ADICacheTuple?) { self.storage = ProbeStorage(cached) }\r\n\r\n    func run(_ allows: Bool) async throws -> (ADICacheTuple, Int)\r\n    {\r\n        return try await ADIRecoveryPolicy.run(\r\n            gate: gate, currentClientInfo: \"current\", allowsRecovery: allows,\r\n            load: self.storage.adapter.load,\r\n            invalidate: { self.invalidations += 1; try self.storage.adapter.invalidate() },\r\n            prepare: {\r\n                self.preparations += 1\r\n                if self.failPreparation { throw ProbeError.preparation }\r\n                return self.fresh\r\n            },\r\n            headers: { tuple in\r\n                self.requests.append(tuple)\r\n                if !self.errors.isEmpty, let error = self.errors.removeFirst() { throw error }\r\n                return 42\r\n            },\r\n            publish: { tuple in\r\n                if self.failPublication { throw ProbeError.publication }\r\n                try self.storage.adapter.publish(tuple)\r\n                self.publications += 1\r\n            },\r\n            checkCancellation: {\r\n                self.cancellationChecks += 1\r\n                if self.cancelAfterPreparation && self.preparations > 0 { throw CancellationError() }\r\n                try Task.checkCancellation()\r\n            })\r\n    }\r\n}\r\n\r\nfunc stale(_ message: String = \"ADI Login error: -45061\", result: String = \"GetHeadersError\") -> Error\r\n{\r\n    ADIHeaderFailure(result: result, message: message, underlying: ProbeError.helper)\r\n}\r\n\r\n@main\r\nstruct ADIRecoveryOfflineProbe\r\n{\r\n    static func main() async throws\r\n    {\r\n        let coherent = ADICacheTuple(identity: Data(repeating: 1, count: 16), adiPB: Data([1]), clientInfo: \"current\")\r\n        var count = 0\r\n        func scenario(_ name: String, _ body: () async throws -> Void) async throws\r\n        {\r\n            try await body()\r\n            count += 1\r\n            print(\"PASS \" + name)\r\n        }\r\n        func expectError(_ state: ProbeState, allows: Bool = true) async -> Error\r\n        {\r\n            do { _ = try await state.run(allows); preconditionFailure(\"Expected failure\") }\r\n            catch { return error }\r\n        }\r\n        func assertReleased(_ state: ProbeState)\r\n        {\r\n            precondition(state.gate.tryAcquire(), \"Gate leaked\")\r\n            state.gate.release()\r\n        }\r\n\r\n        try await scenario(\"cached-success\") {\r\n            let s = ProbeState(coherent)\r\n            let (tuple, value) = try await s.run(true)\r\n            precondition(tuple == coherent && value == 42 && s.preparations == 0 && s.publications == 0)\r\n            assertReleased(s)\r\n        }\r\n        try