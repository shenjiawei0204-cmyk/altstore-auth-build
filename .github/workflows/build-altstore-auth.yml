t s.run(true)\r\n            precondition(s.preparations == 1 && s.requests == [s.fresh])\r\n        }\r\n        try await scenario(\"client-info-mismatch\") {\r\n            let s = ProbeState(ADICacheTuple(identity: coherent.identity, adiPB: coherent.adiPB, clientInfo: \"old\"))\r\n            _ = try await s.run(true)\r\n            precondition(s.preparations == 1 && s.requests == [s.fresh])\r\n        }\r\n        try await scenario(\"other-helper-error\") {\r\n            for failure in [stale(\"ADI Login error: -1\"), stale(result: \"OtherError\"), stale(\"prefix ADI Login error: -45061\")] {\r\n                let s = ProbeState(coherent); s.errors = [failure]\r\n                let error = await expectError(s)\r\n                precondition(error as? ProbeError == .helper && s.preparations == 0 && s.cached == coherent)\r\n                assertReleased(s)\r\n            }\r\n        }\r\n        try await scenario(\"http503\") {\r\n            let s = ProbeState(coherent); s.errors = [ProbeError.http503]\r\n            let error = await expectError(s)\r\n            precondition(error as? ProbeError == .http503 && s.preparations == 0 && s.requests.count == 1)\r\n            assertReleased(s)\r\n        }\r\n        try await scenario(\"later-stage\") {\r\n            let s = ProbeState(coherent); s.errors = [stale()]\r\n            _ = await expectError(s, allows: false)\r\n            precondition(s.preparations == 0 && s.requests == [coherent] && s.cached == coherent)\r\n            let missing = ProbeState(nil)\r\n            _ = await expectError(missing, allows: false)\r\n            precondition(missing.preparations == 0 && missing.requests.isEmpty)\r\n        }\r\n        try await scenario(\"sim-stage\") {\r\n            let s = ProbeState(coherent)\r\n            for _ in 0..<2 {\r\n                let (tuple, _) = try await s.run(false)\r\n                precondition(tuple.identity == coherent.identity)\r\n            }\r\n            s.errors = [stale()]; _ = await expectError(s, allows: false)\r\n            precondition(s.preparations == 0 && s.requests.allSatisfy { $0 == coherent })\r\n        }\r\n        try await scenario(\"failed-preparation\") {\r\n            let s = ProbeState(coherent); s.errors = [stale()]; s.failPreparation = true\r\n            let error = await expectError(s)\r\n            precondition(error as? ProbeError == .preparation && s.preparations == 1 && s.publications == 0 && s.cached == nil)\r\n            assertReleased(s)\r\n        }\r\n        try await scenario(\"gate-busy\") {\r\n            let s = ProbeState(coherent); precondition(s.gate.tryAcquire())\r\n            let error = await expectError(s)\r\n            guard case ADIRecoveryError.busy = error else { preconditionFailure(\"Expected busy\") }\r\n            precondition(s.requests.isEmpty && s.preparations == 0)\r\n            s.gate.release()\r\n            s.errors = [ProbeError.http503]; _ = await expectError(s); assertReleased(s)\r\n            _ = try await s.run(true)\r\n        }\r\n        try await scenario(\"cancellation\") {\r\n            let s = ProbeState(nil); s.cancelAfterPreparation = true\r\n            let error = await expectError(s)\r\n            precondition(error is CancellationError && s.requests.isEmpty && s.publications == 0 && s.cached == nil)\r\n            assertReleased(s)\r\n        }\r\n        try await scenario(\"publish-failure\") {\r\n            let s = ProbeState(nil); s.failPublication = true\r\n            let error = await expectError(s)\r\n            precondition(error as? ProbeError == .publication && s.requests.count == 1 && s.cached == nil)\r\n            assertReleased(s)\r\n        }\r\n        try await scenario(\"exact-classifier\") {\r\n            precondition(ADIHeaderFailure(result: \"GetHeadersError\", message: \"  ADI  Login error: \\n -45061 \\t\", underlying: ProbeError.helper).permitsFreshPreparation)\r\n            for message in [\"-45061\", \"ADI L