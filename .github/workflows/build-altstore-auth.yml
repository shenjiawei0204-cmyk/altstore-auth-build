          "run": "set -euo pipefail\napp=\"$RUNNER_TEMP/AltStoreDerivedData/Build/Products/Release-iphoneos/AltStore.app\"\nout=\"$RUNNER_TEMP/export\"\nstage=\"$RUNNER_TEMP/ipa-stage\"\ntest -d \"$app\"\nplutil -lint \"$app/Info.plist\"\nexec_name=$(/usr/libexec/PlistBuddy -c \"Print CFBundleExecutable\" \"$app/Info.plist\")\n[[ -n \"$exec_name\" && \"$exec_name\" != */* ]]\nxcrun lipo \"$app/$exec_name\" -verify_arch arm64\nxcrun vtool -show-build \"$app/$exec_name\" > \"$RUNNER_TEMP/macho-build.txt\"\ngrep -Eq 'platform[[:space:]]+IOS([[:space:]]|$)' \"$RUNNER_TEMP/macho-build.txt\"\npython3 \"$RUNNER_TEMP/launch_readiness.py\" prepare \"$app\" upstream/AltStore/AltStore.entitlements \"$RUNNER_TEMP/launch-readiness.json\"\nmkdir -p \"$out\" \"$stage/Payload\"\nditto \"$app\" \"$stage/Payload/AltStore.app\"\n(cd \"$stage\" && /usr/bin/zip -qry \"$out/AltStore-auth-test-unsigned.ipa\" Payload)\npython3 - \"$out\" \"$app\" <<'PY'\nimport datetime, hashlib, json, os, pathlib, plistlib, re, subprocess, sys, zipfile\nout, app = map(pathlib.Path, sys.argv[1:])\nsys.path.insert(0, os.environ[\"RUNNER_TEMP\"])\nfrom launch_readiness import inspect_ipa\nipa = out / \"AltStore-auth-test-unsigned.ipa\"\nlimit = 100 * 1024 * 1024\nif not 0 < ipa.stat().st_size < limit: raise SystemExit(\"IPA exceeds the 100 MiB upload envelope\")\nwith zipfile.ZipFile(ipa) as archive:\n    names = archive.namelist()\n    if len(names) != len(set(names)): raise SystemExit(\"Duplicate ZIP entries\")\n    for name in names:\n        parts = pathlib.PurePosixPath(name).parts\n        if name.startswith(\"/\") or \"..\" in parts or \"\\\\\" in name: raise SystemExit(\"Invalid archive path\")\n        if pathlib.PurePosixPath(name).suffix.lower() in {\".p12\", \".pfx\", \".pem\", \".key\", \".mobiledevicepairing\", \".mobileprovision\"}: raise SystemExit(\"Signing/pairing material is not allowed in this unsigned artifact\")\n    if archive.testzip() is not None: raise SystemExit(\"ZIP CRC check failed\")\n    info = plistlib.loads(archive.read(\"Payload/AltStore.app/Info.plist\"))\n    if info.get(\"CFBundleIdentifier\") != \"com.rileytestut.AltStore\": raise SystemExit(\"Unexpected app identity\")\n    minimum = tuple(int(part) for part in str(info[\"MinimumOSVersion\"]).split(\".\"))\n    if minimum > (18, 7, 2): raise SystemExit(\"App OS floor exceeds the intended device version\")\n    executable = info[\"CFBundleExecutable\"]\n    if pathlib.PurePosixPath(executable).name != executable: raise SystemExit(\"Invalid executable name\")\n    header = archive.read(\"Payload/AltStore.app/\" + executable)[:4]\n    if header not in {b\"\\xcf\\xfa\\xed\\xfe\", b\"\\xca\\xfe\\xba\\xbe\", b\"\\xca\\xfe\\xba\\xbf\"}: raise SystemExit(\"Unexpected Mach-O header\")\n    roots = {name.split(\"/\")[1] for name in names if name.startswith(\"Payload/\") and len(name.split(\"/\")) > 2}\n    if roots != {\"AltStore.app\"}: raise SystemExit(\"Unexpected root application set\")\nwith ipa.open(\"rb\") as stream:\n    ipa_sha256 = hashlib.file_digest(stream, \"sha256\").hexdigest()\nmain_template = inspect_ipa(ipa)\nlaunch_report = json.loads(pathlib.Path(os.environ[\"RUNNER_TEMP\"], \"launch-readiness.json\").read_text(encoding=\"utf-8\"))\nlaunch_source = json.loads(pathlib.Path(os.environ[\"RUNNER_TEMP\"], \"launch-patch.json\").read_text(encoding=\"utf-8\"))\nif not launch_report.get(\"codeSignDeepStrictVerified\") or not launch_report.get(\"adHocOnly\") or launch_report.get(\"developerSignatureVerified\") is not False: raise SystemExit(\"Launch signing-template verification missing\")\nif hashlib.sha256(pathlib.Path(\"upstream/AltStoreCore/Model/DatabaseManager.swift\").read_bytes()).hexdigest() != launch_source[\"databaseAfterSha256\"]: raise SystemExit(\"Migration safety source drift\")\nlaunch_report.update(packagedExecutable=main_template, migrationSource=launch_source)\npolicy = json.loads(pathlib.Path(os.environ[\"RUNNER_TEMP\"], \"provider-policy.json\").read_text(encoding=\"utf-8\"))\nif policy[\"provider\"] != \"https://ani.jkcoxson.com\" or policy[\"automaticFallback\"] or policy[\"redirects\"] != \"reject\": raise SystemExit(\"Provider restriction report mismatch\")\nfor name, record in policy[\"files\"].items():\n    path = pathlib.Path(\"upstream\", name)\n    with path.open(\"rb\") as stream: actual = hashlib.file_digest(stream, \"sha256\").hexdigest()\n    if actual != record[\"afterSha256\"]: raise SystemExit(\"Patched source changed after policy verification\")\nmanifest = {\n    \"status\": \"ad_hoc_entitlement_template_requires_local_resigning\",\n    \"builtUtc\": datetime.datetime.now(datetime.timezone.utc).isoformat(),\n    \"sourceRepository\": \"https://github.com/altstoreio/AltStore\",\n    \"sourceCommit\": \"22f766d2edb47626a082a1f775649bcf3fc43aff\",\n    \"altSignCommit\": \"832d9cec339ea6ef6891011833dbb7227b028a29\",\n    \"bundleIdentifier\": info[\"CFBundleIdentifier\"],\n    \"version\": info.get(\"CFBundleShortVersionString\"),\n    \"build\": info.get(\"CFBundleVersion\"),\n    \"minimumOsVersion\": info[\"MinimumOSVersion\"],\n    \"authenticationVerified\": False,\n    \"deviceTested\": False,\n    \"providerConsentRequiredBeforeUse\": True,\n    \"localSigningAndInitializationRequired\": True,\n    \"submodules\": pathlib.Path(os.environ[\"RUNNER_TEMP\"], \"submodules.txt\").read_text(),\n    \"xcode\": subprocess.check_output([\"xcodebuild\", \"-version\"], text=True).strip(),\n    \"workflowRun\": \"https://github.com/\" + os.environ[\"GITHUB_REPOSITORY\"] + \"/actions/runs/\" + os.environ[\"GITHUB_RUN_ID\"],\n    \"ipaSha256\": ipa_sha256,\n    \"providerPolicy\": policy,\n    \"launchReadiness\": launch_report,\n    \"effectiveSourceModified\": True,\n    \"workflowCommit\": os.environ.get(\"GITHUB_SHA\"),\n}\n(out / \"BUILD-MANIFEST.json\").write_text(json.dumps(manifest, indent=2) + \"\\n\", encoding=\"utf-8\")\nlicense_text = pathlib.Path(\"upstream/LICENSE\").read_text(encoding=\"utf-8\")\nnotice = \"Experimental, non-official AltStore build with a public ad-hoc entitlement template; final developer signing is required. Authentication and device renewal are NOT verified.\\n\\nMatching source: https://github.com/altstoreio/AltStore/tree/22f766d2edb47626a082a1f775649bcf3fc43aff\\nAltSign: https://github.com/rileytestut/AltSign/tree/832d9cec339ea6ef6891011833dbb7227b028a29\\nAll dependency commit IDs appear in BUILD-MANIFEST.json; each dependency retains its original license.\\nDo not sign in or replace an existing app before provider and identity review.\\n\\n\"\n(out / \"SOURCE-LICENSE.txt\").write_text(notice + \"Locally modified provider policy: https://ani.jkcoxson.com only; no fallback or provider redirects. Matching modification is embedded in the workflow commit recorded by BUILD-MANIFEST.json.\\n\\n\" + license_text, encoding=\"utf-8\")\nchecksums = []\nfor name in (\"AltStore-auth-test-unsigned.ipa\", \"BUILD-MANIFEST.json\", \"SOURCE-LICENSE.txt\"):\n    with (out / name).open(\"rb\") as stream: digest = hashlib.file_digest(stream, \"sha256\").hexdigest()\n    checksums.append(digest + \"  \" + name)\n(out / \"SHA256SUMS.txt\").write_text(\"\\n\".join(checksums) + \"\\n\", encoding=\"utf-8\")\nif sum(path.stat().st_size for path in out.iterdir()) >= limit: raise SystemExit(\"Artifact set exceeds the 100 MiB upload envelope\")\nprint(json.dumps({\"status\": manifest[\"status\"], \"ipaBytes\": ipa.stat().st_size, \"ipaSha256\": manifest[\"ipaSha256\"], \"deviceTested\": False}))\nPY\necho \"package_ok=true\" >> \"$GITHUB_OUTPUT\""
